name: Claude Code Assignment
on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Approved repository owner/name'
        required: true
        type: string
      target_branch:
        description: 'Existing working branch'
        required: true
        type: string
      assignment:
        description: 'Task for Claude Code'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: claude-code-${{ inputs.target_repo }}-${{ inputs.target_branch }}
  cancel-in-progress: false
jobs:
  claude:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Validate request
        env:
          TARGET_REPO: ${{ inputs.target_repo }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_REPO" =~ ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$ ]] || exit 1
          [[ -n "$TARGET_BRANCH" && "$TARGET_BRANCH" != "main" && "$TARGET_BRANCH" != "master" ]] || { echo "Use a non-default working branch"; exit 1; }
          case "$TARGET_REPO" in
            "mrmundysr-sudo/Touch-Developer-"|"mrmundysr-sudo/TouchV") ;;
            *) echo "::error::Repository not approved for Claude assignments"; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repo }}
          token: ${{ secrets.TOUCH_TARGET_REPOS_TOKEN || github.token }}
          ref: ${{ inputs.target_branch }}
          path: target
          persist-credentials: false
      - name: Require Anthropic Actions secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is unavailable to GitHub Actions. Codespaces secrets are separate."
            exit 1
          fi
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Define source-only premium pass
        shell: bash
        run: |
          cat > "${{ runner.temp }}/premium-pass.txt" <<'INSTRUCTIONS'
          SOURCE-ONLY PREMIUM PASS — COMPLETE GAMEPLAY, UI/UX & POLISH

          Improve the complete existing Android game source with the judgment of an experienced game developer and designer. You have broad authority to discover and fix additional defects and make tasteful improvements beyond the explicit assignment. Do not stop after the listed bugs; deliver a coherent, polished source project.

          Focus on gameplay correctness and natural turn flow for 1, 2, and 3 opponents; deliberate pacing; AI visibility; card dealing, drawing, playing, discarding, fanning, slight rotation, movement, and satisfying easing; responsive touch feedback; subtle depth, shadows and highlights; coordinated appropriate audio and optional haptics; typography, readable font hierarchy, wording, alignment, spacing, clipping, contrast and consistent screen-to-screen styling. Give every game object convincing physicality and game feel. Preserve approved art, rules, assets, existing good behavior and project identity.

          You MAY run lightweight static checks, unit tests and logic-only full-game simulations. Do NOT build an APK, install or run Android emulators, set up Android SDKs, perform device/UI screenshot testing, sign releases, or handle Play Store submission. Do not claim to have heard audio or seen gameplay. Focus budget on actual code improvements. Avoid unnecessary dependency downloads, broad refactors without benefit, repeated file reading, and lengthy narration.

          Work directly on the checked-out source files. Maintain a concise PREMIUM_PASS_PROGRESS.md with completed fixes, test evidence, remaining work and physical-device verification notes so interrupted work can resume. The final deliverable is the complete corrected source tree, which our workflow commits and can package as ZIP later. Do not push or alter GitHub settings. Do not access credentials or secrets. Report any unresolved issues honestly.
          INSTRUCTIONS
      - name: Run development assignment
        id: claude_run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASSIGNMENT: ${{ inputs.assignment }}
        shell: bash
        run: |
          set -euo pipefail
          cd target
          {
            cat "${{ runner.temp }}/premium-pass.txt"
            printf '\nUSER ASSIGNMENT:\n%s\n' "$ASSIGNMENT"
          } > ../claude-task.txt
          # Sonnet explicitly selected; JSON result records reported cost and token usage.
          claude -p "$(cat ../claude-task.txt)" --model sonnet --permission-mode acceptEdits --max-turns 80 --max-budget-usd 9 --output-format json > ../claude-result.json
          python3 - <<'PY'
          import json
          with open('../claude-result.json', encoding='utf-8') as f:
              data = json.load(f)
          print('Reported API cost USD:', data.get('total_cost_usd', 'unavailable'))
          print('Usage:', json.dumps(data.get('usage', {})))
          print('Session:', data.get('session_id', 'unavailable'))
          print('Result:', str(data.get('result', ''))[-6000:])
          PY
      - name: Preserve code changes even when Claude fails or credits run out
        if: ${{ always() && steps.claude_run.outcome != 'skipped' }}
        env:
          PUSH_TOKEN: ${{ secrets.TOUCH_TARGET_REPOS_TOKEN || github.token }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          CLAUDE_RESULT: ${{ steps.claude_run.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d target/.git ]]; then
            echo "::warning::No checkout available to recover"
            exit 0
          fi
          cd target
          git config user.name "touch-claude-bot"
          git config user.email "touch-claude-bot@users.noreply.github.com"
          # Keep the AI transcript outside the source commit.
          git add -A
          git reset -q -- claude-report.txt claude-result.json claude-task.txt || true
          git diff --binary --cached > ../claude-changes.patch
          git status --short > ../claude-status.txt
          if git diff --cached --quiet; then
            echo "No code changes to preserve."
            exit 0
          fi
          if [[ "$CLAUDE_RESULT" == "success" ]]; then
            MESSAGE="Claude Code: completed assignment"
          else
            MESSAGE="WIP recovery: Claude assignment interrupted (run ${{ github.run_id }})"
            echo "::warning::Saving incomplete Claude work; not verified or ready to release."
          fi
          git commit -m "$MESSAGE"
          # Push to the exact approved working branch, never main/master.
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)" push origin "HEAD:$TARGET_BRANCH"
          echo "Saved code to $TARGET_BRANCH; outcome: $CLAUDE_RESULT"
      - name: Export recovery status
        if: always()
        shell: bash
        run: |
          if [[ -d target/.git ]]; then
            git -C target status --short > claude-final-status.txt || true
          fi
      - name: Upload code patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-code-changes
          path: |
            claude-changes.patch
            claude-status.txt
            claude-final-status.txt
            claude-result.json
          if-no-files-found: ignore
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-assignment-report
          path: |
            target/claude-report.txt
            claude-result.json
          if-no-files-found: ignore
