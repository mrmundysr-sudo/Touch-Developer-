name: Claude Code Assignment
on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Repository owner/name (must be accessible to workflow token)'
        required: true
        type: string
      target_branch:
        description: 'Existing working branch'
        required: true
        type: string
      assignment:
        description: 'Task for Claude Code'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: claude-code-${{ inputs.target_repo }}-${{ inputs.target_branch }}
  cancel-in-progress: false
jobs:
  claude:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate request
        env:
          TARGET_REPO: ${{ inputs.target_repo }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_REPO" =~ ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$ ]] || exit 1
          [[ -n "$TARGET_BRANCH" && "$TARGET_BRANCH" != "main" && "$TARGET_BRANCH" != "master" ]] || { echo "Use a non-default working branch"; exit 1; }
          if [[ "$TARGET_REPO" != "$GITHUB_REPOSITORY" ]]; then
            echo "Cross-repository execution requires separately scoped credentials; blocked for safety."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          persist-credentials: true
      - name: Require Anthropic Actions secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is unavailable to GitHub Actions. Codespaces secrets are separate."
            exit 1
          fi
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Run bounded assignment
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASSIGNMENT: ${{ inputs.assignment }}
        shell: bash
        run: |
          set -euo pipefail
          claude -p "Work in this checkout only. Do not access secrets, change GitHub settings, or push. Preserve existing functionality. Task: $ASSIGNMENT" --permission-mode plan --max-turns 8 --output-format text > claude-report.txt
          cat claude-report.txt
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-assignment-report
          path: claude-report.txt
          if-no-files-found: ignore
